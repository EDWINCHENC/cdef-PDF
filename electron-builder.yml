# electron-builder 配置：Windows 独立版
# 产物：NSIS 安装包 + 便携版（x64）
appId: studio.cdef.pdf
productName: CDEF PDF Studio
copyright: 开源项目，与 WPS / 金山公司无隶属关系
# staging 目录无 node_modules，显式指定 Electron 版本
electronVersion: 44.10.2

directories:
  output: release
  buildResources: build

# 引擎与 OCR 助手作为 extraResources 随附（不进 asar，便于 PyInstaller 产物布局）
extraResources:
  - from: build/engine-dist/
    to: engine/
    filter:
      - "**/*"

files:
  - dist/**/*
  - desktop/**/*
  - source/**/*
  - package.json
  - "!**/*.map"

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: x64
    - target: portable
      arch: x64
  artifactName: ${productName}-${version}-${arch}.${ext}

# macOS 仅用于开发验证，跳过 DMG（沙箱/无 UI 环境不可用）
mac:
  target:
    - target: zip
      arch: arm64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: CDEF PDF Studio
  # 安装过程展示 AGPL 许可（分发合规）
  license: LICENSE
  # 卸载时保留用户数据（恢复文件在 userData，由应用内清理入口管理）
  deleteAppDataOnUninstall: false

portable:
  artifactName: ${productName}-${version}-portable.${ext}

# 引擎冻结产物较大，压缩级别均衡
compression: normal
