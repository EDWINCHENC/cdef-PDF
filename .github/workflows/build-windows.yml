name: build-windows

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装引擎依赖
        run: |
          python -m venv .venv
          .venv/Scripts/python -m pip install -r engine-requirements.txt
      - name: 引擎测试（86 项）
        run: npm run test:engine
      - name: 桌面/平台测试（15 项）
        run: npm test
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: UI 构建
        run: |
          npm ci
          npm run build

  ui-test:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装引擎依赖
        run: |
          python -m venv .venv
          .venv/Scripts/python -m pip install -r engine-requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 安装前端依赖并构建
        run: |
          npm ci
          npm run build
      - name: Playwright UI 测试（27 项，中英双语）
        run: npx playwright test --reporter=line

  package:
    needs: [test, ui-test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装引擎依赖（含 PyInstaller）
        run: |
          python -m venv .venv
          .venv/Scripts/python -m pip install -r engine-requirements.txt pyinstaller
      - name: 冻结引擎（Windows .exe）
        run: npm run engine:freeze
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 安装前端依赖并构建
        run: |
          npm ci
          npm run build
      - name: 打包（NSIS 安装包 + portable）
        run: npm run package
      - name: 收集产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            release/*.exe
            release/*.blockmap
          if-no-files-found: error
